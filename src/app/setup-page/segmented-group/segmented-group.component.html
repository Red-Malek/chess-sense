<div class="group" role="radiogroup" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <label class="segment" [attr.title]="option.hint ?? null" [class.disabled]="option.disabled">
      <input
        type="radio"
        [name]="name()"
        [value]="option.value"
        [checked]="option.value === value()"
        [disabled]="option.disabled"
        (change)="selectionChange.emit(option.value)"
      />
      @if (option.value === value()) {
        <svg class="check" viewBox="0 0 16 16" aria-hidden="true">
          <path d="m3.5 8.5 3 3 6-7" />
        </svg>
      }
      <span>{{ option.label }}</span>
    </label>
  }
</div>

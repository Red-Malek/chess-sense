<form class="form" [formGroup]="form" (ngSubmit)="submit()">
  <fieldset class="verdicts">
    <legend>Who is better?</legend>
    <div class="options">
      @for (option of verdictOptions; track option.value) {
        <label class="option" [attr.data-verdict]="option.value">
          <input type="radio" formControlName="verdict" [value]="option.value" />
          <span class="swatch" aria-hidden="true"></span>
          <span class="option-label">{{ option.label }}</span>
        </label>
      }
    </div>
  </fieldset>

  <div class="confidence">
    <div class="confidence-head">
      <label for="confidence">Confidence</label>
      <output for="confidence" class="readout" [class.unset]="confidence() === null">
        {{ confidence() === null ? '—' : confidence() + '%' }}
      </output>
    </div>

    <div class="slider" [style.--pct]="sliderPercent()" [class.unset]="confidence() === null">
      <input
        id="confidence"
        type="range"
        min="50"
        max="100"
        step="1"
        formControlName="confidence"
        (click)="commitConfidence($event)"
      />
      <span class="track"></span>
      <span class="fill"></span>
      <span class="thumb"></span>
    </div>

    <div class="ticks" aria-hidden="true">
      <span>50%</span>
      <span>75%</span>
      <span>100%</span>
    </div>

    @if (form.controls.confidence.touched && form.controls.confidence.invalid) {
      <p class="error">Choose a confidence between 50% and 100%.</p>
    }
  </div>

  <button type="submit" [disabled]="form.invalid">Submit evaluation</button>
</form>
